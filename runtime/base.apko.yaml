# The base every Mayfly app runs on: Node 24 from Wolfi and what it needs, nothing else.
# No shell, no package manager. Built by build.sh from base.apko.lock.json, which pins every package.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - nodejs-24
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"
# Wolfi leaves /var/tmp writable by anyone without the sticky bit; this restores the usual 1777.
paths:
  - path: /var/tmp
    type: directory
    permissions: 0o1777
    uid: 0
    gid: 0
entrypoint:
  command: /usr/bin/node
archs:
  - x86_64
