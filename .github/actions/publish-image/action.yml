name: Publish an image
description: >-
  Pushes a local image to GHCR tagged with the commit and main, signs it with Sigstore, and attests its SBOM and
  build provenance. Needs podman, cosign and pixi, and a job that may write packages, id tokens and attestations.
inputs:
  local:
    description: The local image to publish
    required: true
  remote:
    description: Where to publish it, without a tag
    required: true
  token:
    description: A token that can write packages
    required: true
runs:
  using: composite
  steps:
    - name: Push, tagged with the commit and main
      id: push
      shell: bash
      env:
        LOCAL: ${{ inputs.local }}
        REMOTE: ${{ inputs.remote }}
        TOKEN: ${{ inputs.token }}
      run: |
        # cosign and syft read the same Docker-style credentials file.
        mkdir -p "$HOME/.docker"
        echo "$TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --authfile "$HOME/.docker/config.json"
        for tag in "$GITHUB_SHA" main; do
          podman push --authfile "$HOME/.docker/config.json" --digestfile "$RUNNER_TEMP/digest" "$LOCAL" "docker://$REMOTE:$tag"
        done
        echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
    - name: Sign with Sigstore, keyless
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: cosign sign --yes "$REMOTE@$DIGEST"
    - name: List what is inside (SBOM)
      shell: bash
      env:
        REMOTE: ${{ inputs.remote }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: pixi run --frozen syft "$REMOTE@$DIGEST" --output "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.remote }}
        subject-digest: ${{ steps.push.outputs.digest }}
        sbom-path: ${{ runner.temp }}/sbom.spdx.json
        push-to-registry: true
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.remote }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
