name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit, with their tag alongside.
jobs:
  checks:
    name: Hooks, typecheck and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          locked: true
          cache: true
      - run: npm ci && npm ci --prefix runtime
      - run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check each new commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$BASE..$HEAD"
          # A new branch has no "before": check its whole history.
          [[ "$BASE" =~ ^0+$ ]] && range="$HEAD"
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            pipx run pre-commit==4.7.0 run --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/message"
          done

  image:
    name: Runtime image proof and integration tests on Podman 5
    runs-on: ubuntu-24.04
    outputs:
      image-id: ${{ steps.proof.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          locked: true
          cache: true
      - uses: ./.github/actions/setup-podman
      - run: npm ci && npm ci --prefix runtime
      - name: Prove the runtime image meets policy
        id: proof
        run: |
          pixi run check-image
          echo "image-id=$(podman image inspect --format '{{.Id}}' localhost/mayfly-runtime:dev)" >> "$GITHUB_OUTPUT"
      - run: npm run test:integration

  publish:
    name: Publish the runtime image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, commits, image]
    runs-on: ubuntu-24.04
    # Only this job can write packages, and only one runs at a time so the main tag moves in order.
    concurrency: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/jgalego/mayfly-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          locked: true
          cache: true
      - uses: ./.github/actions/setup-podman
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.4
      - run: npm ci --prefix runtime
      - name: Rebuild exactly the image the image job proved
        env:
          PROVEN: ${{ needs.image.outputs.image-id }}
        run: |
          built="$(runtime/build.sh)"
          [[ "$built" == "$PROVEN" ]] || { echo "built $built, but the image job proved $PROVEN"; exit 1; }
      - name: Push, tagged with the commit and main
        id: push
        env:
          TOKEN: ${{ github.token }}
        run: |
          # cosign and syft read the same Docker-style credentials file.
          mkdir -p "$HOME/.docker"
          echo "$TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --authfile "$HOME/.docker/config.json"
          for tag in "$GITHUB_SHA" main; do
            podman push --authfile "$HOME/.docker/config.json" --digestfile "$RUNNER_TEMP/digest" localhost/mayfly-runtime:dev "docker://$IMAGE:$tag"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
      - name: Sign with Sigstore, keyless
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: List what is inside (SBOM)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: pixi run --frozen syft "$IMAGE@$DIGEST" --output "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
