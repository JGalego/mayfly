# Tools that check and describe the runtime image, pinned by pixi.lock so they match locally and in CI.
[workspace]
name = "mayfly"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
conftest = "==0.71.1"
grype = "==0.122.1"
syft = "==1.57.2"

[tasks]
check-image = "runtime/check.sh"

# Draws docs/architecture/architecture.png from its code: `pixi run diagram`.
[feature.docs.dependencies]
python = "3.13.*"
graphviz = "*"

[feature.docs.pypi-dependencies]
diagrams = "==0.25.1"

[feature.docs.tasks]
diagram = "python docs/architecture/architecture.py"

[environments]
docs = ["docs"]
