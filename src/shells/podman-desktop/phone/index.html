<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#8e51ff">
    <meta name="apple-mobile-web-app-title" content="Mayfly">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="phone.css">
    <title>Mayfly</title>
  </head>
  <body>
    <header class="phone-bar">
      <button id="back" class="quiet-button" type="button" aria-label="Your apps" data-icon="back" hidden></button>
      <img src="logo.svg" alt="" class="phone-logo">
      <h1 id="title">Mayfly</h1>
      <a id="open-app" class="open-app" target="_blank" rel="noopener" data-icon="external" hidden>Open</a>
    </header>
    <p id="link-status" class="link-status" role="status">Connecting to Mayfly…</p>

    <main id="home">
      <ol id="making" class="phone-turns"></ol>
      <ul id="phone-apps" aria-label="Your apps"></ul>
      <p id="no-apps" class="quiet empty" hidden>Describe an app below with a photo of a sketch if you have one</p>
    </main>
    <main id="chat" hidden>
      <ol id="turns"></ol>
    </main>
    <main id="unpaired" hidden>
      <img src="logo.svg" alt="" class="hero">
      <p id="unpaired-text"></p>
    </main>

    <form id="composer">
      <ul id="pending-files" class="pending-files" aria-label="Attached files" hidden></ul>
      <div class="request-field">
        <div id="request-backdrop" class="request-backdrop" aria-hidden="true"></div>
        <textarea id="request" rows="2" maxlength="2000" aria-label="Your request" placeholder="Describe an app to make"></textarea>
      </div>
      <div class="composer-actions">
        <input id="file-input" type="file" multiple accept="image/*,.txt,.md,.csv,.tsv,.json" hidden>
        <button id="attach" class="quiet-button" type="button" aria-label="Attach photos or text files" data-icon="paperclip"></button>
        <button id="send" class="primary" type="submit" data-icon="rocket" disabled>Send</button>
      </div>
    </form>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="phone.js"></script>
  </body>
</html>
