<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Mayfly</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="0.55" stop-color="#FF9A52"/>
      <stop offset="1" stop-color="#E2475E"/>
    </linearGradient>
    <clipPath id="above-water">
      <rect width="256" height="204"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#dusk)"/>
  <circle cx="128" cy="160" r="72" fill="#FFF3D1" opacity="0.85" clip-path="url(#above-water)"/>
  <g stroke="#FFF3D1" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M70,214 H186"/>
    <path d="M92,226 H164"/>
    <path d="M112,238 H144"/>
  </g>
  <g transform="translate(128 124) scale(0.92) translate(-142 -122)" fill="#2A1E3F" stroke="#2A1E3F" stroke-linecap="round" stroke-linejoin="round">
    <!-- tails -->
    <g fill="none" stroke-width="2.5">
      <path d="M186,126 C204,112 220,96 232,70"/>
      <path d="M186,126 C206,117 224,105 240,88"/>
      <path d="M186,126 C208,123 226,118 242,108"/>
    </g>
    <!-- legs -->
    <g fill="none" stroke-width="3">
      <path d="M72,158 L62,174 L46,180"/>
      <path d="M86,161 L91,178 L85,194"/>
      <path d="M96,160 L108,177 L115,193"/>
    </g>
    <!-- antenna -->
    <path d="M54,143 L44,134" fill="none" stroke-width="2.5"/>
    <!-- forewing -->
    <path d="M76,146 C86,112 100,76 120,40 C138,58 152,84 156,110 C142,126 120,138 100,146 Z" stroke-width="2"/>
    <!-- head, thorax -->
    <circle cx="60" cy="150" r="9" stroke="none"/>
    <ellipse cx="83" cy="151" rx="18" ry="12" stroke="none"/>
    <!-- abdomen: stacked segments -->
    <g stroke="none">
      <rect x="-6" y="-8" width="12" height="16" rx="3" transform="translate(106 152) rotate(-4)"/>
      <rect x="-6" y="-7.5" width="12" height="15" rx="3" transform="translate(119.5 150.5) rotate(-7)"/>
      <rect x="-6" y="-7" width="12" height="14" rx="3" transform="translate(133 148) rotate(-10)"/>
      <rect x="-6" y="-6.5" width="12" height="13" rx="3" transform="translate(146 144.5) rotate(-14)"/>
      <rect x="-5.5" y="-6" width="11" height="12" rx="3" transform="translate(158.5 140) rotate(-18)"/>
      <rect x="-5" y="-5.5" width="10" height="11" rx="3" transform="translate(170 134.5) rotate(-22)"/>
      <rect x="-5" y="-5" width="10" height="10" rx="3" transform="translate(181 128.5) rotate(-27)"/>
    </g>
    <!-- wing veins and eye -->
    <g fill="none" stroke="#FFF3D1" stroke-width="1.4" opacity="0.6">
      <path d="M86,144 L119,48"/>
      <path d="M90,144 L131,60"/>
      <path d="M94,144 L142,76"/>
      <path d="M98,144 L150,94"/>
      <path d="M103,144 L152,110"/>
    </g>
    <circle cx="57" cy="147" r="3.2" fill="#FFF3D1" stroke="none"/>
  </g>
</svg>
