default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: no-assistant-trailers
        name: no assistant trailers
        language: pygrep
        entry: "(?i)^co-authored-by:"
        stages: [commit-msg]
      - id: typecheck
        name: typecheck
        language: system
        entry: npm run -s typecheck
        pass_filenames: false
        files: \.(ts|json)$
      - id: unit-tests
        name: unit tests
        language: system
        entry: npm test
        pass_filenames: false
        files: \.ts$
